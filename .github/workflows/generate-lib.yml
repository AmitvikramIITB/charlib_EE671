name: Generate Liberty (.lib) Files

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows users to trigger it manually from the Actions tab

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (NGSPICE)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice libngspice0-dev

      - name: Install Python Dependencies (CharLib & Volare)
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/infinitymdm/PySpice
          pip install charlib volare

      - name: Download sky130 PDK
        run: |
          mkdir -p /home/runner/pdk
          volare enable --pdk sky130 default --pdk-root /home/runner/pdk

      - name: Run CharLib Characterization
        run: charlib run config/
        
      - name: Upload .lib Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sky130-lib-files
          path: output/*.lib
          if-no-files-found: error
