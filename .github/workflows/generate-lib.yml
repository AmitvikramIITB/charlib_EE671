name: Generate Liberty (.lib) Files

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (NGSPICE)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice libngspice0-dev

      - name: Install Python Dependencies (CharLib & Ciel)
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/infinitymdm/PySpice
          pip install charlib ciel

      - name: Download sky130 PDK via Ciel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /home/runner/pdk
          export PDK_ROOT=/home/runner/pdk
          ciel enable --pdk-family sky130 78b7bc32ddb4b6f14f76883c2e2dc5b5de9d1cbc

      - name: Run CharLib Characterization
        run: |
          export PDK_ROOT=/home/runner/pdk
          charlib run config/
        
      - name: Upload .lib Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sky130-lib-files
          path: output/*.lib
          if-no-files-found: error
