name: Generate Liberty (.lib) Files

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (NGSPICE)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice libngspice0-dev

      - name: Install Python Dependencies (CharLib & Ciel)
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/stineje/CharLib.git@2.0.0
          pip install ciel
          pip install "numpy<2" --force-reinstall

      - name: Download sky130 PDK via Ciel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PDK_ROOT=/home/runner/pdk
          mkdir -p $PDK_ROOT
          ciel enable --pdk-family sky130 78b7bc32ddb4b6f14f76883c2e2dc5b5de9d1cbc

          echo "--- PDK_ROOT layout ---"
          ls -la $PDK_ROOT

          # ciel already creates $PDK_ROOT/sky130A; link to that
          ln -sfn "$(readlink -f $PDK_ROOT/sky130A)" ./sky130A

          # Fail here, with a clear message, if the model file isn't reachable
          test -f sky130A/libs.tech/ngspice/sky130.lib.spice

      - name: Run CharLib Characterization
        run: |
          export PDK_ROOT=/home/runner/pdk
          charlib run config/
          echo "--- output dir ---"
          ls -R output || true

      - name: Upload .lib Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sky130-lib-files
          path: output/*.lib
          if-no-files-found: error
